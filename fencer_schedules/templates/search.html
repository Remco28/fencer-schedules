<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fencer Schedules</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div style="display:flex;gap:10px;align-items:center">
        <div class="mark">†</div>
        <h1>Fencer Schedules</h1>
      </div>
      <a class="icon-btn" href="/settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.97z"/>
        </svg>
      </a>
    </div>
    <p class="dim" style="margin:0;color:#94a3b8;font-size:.9rem">Elite Fencers Club</p>
  </header>
  <main class="sheet">
    <form class="search" action="/search" method="get">
      <input type="search" name="q" value="{{ q }}" placeholder="Trick or Retreat">
      <button class="btn-gold" type="submit">Search</button>
    </form>

    {% if hits is not none %}
      {% if hits %}
        {% for t in hits %}
          <form action="/tournaments/{{ t.askfred_id }}/open" method="post">
            <button class="hit" type="submit">
              <strong>{{ t.name }}</strong><br>
              <span class="muted">{{ t.start_date|span(t.end_date) }} · {{ t.venue or "—" }}</span>
              <span class="badge {% if not t.usfa_id %}soft{% endif %}">{{ "USFA" if t.usfa_id else "local" }}</span>
              {% if loaded and t.askfred_id in loaded|map(attribute='askfred_id') %}
                <span class="badge soft">saved</span>
              {% endif %}
            </button>
          </form>
        {% endfor %}
      {% else %}
        <p class="muted">No upcoming matches.</p>
      {% endif %}
    {% endif %}

    {% if loaded %}
      <h2 class="day-head">Saved tournaments</h2>
      {% for t in loaded %}
        <div class="saved-row">
          <form action="/tournaments/{{ t.askfred_id }}/open" method="post">
            <button class="btn-ghost" type="submit">
              <div class="name">{{ t.name }}</div>
              <div class="muted">{{ t.start_date|span(t.end_date) }}{% if current and t.askfred_id == current.askfred_id %} · open{% endif %}</div>
            </button>
          </form>
          <form action="/tournaments/{{ t.askfred_id }}/remove" method="post">
            <button class="btn-remove" type="submit">Remove</button>
          </form>
        </div>
      {% endfor %}
    {% endif %}
  </main>
</body>
</html>
