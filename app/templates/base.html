<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Fencer Schedules{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <header class="container">
        <nav>
            <a href="/" class="brand">Fencer Schedules</a>
            <div class="nav-links">
                {% if user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/tournament/new">Track</a>
                <a href="/profile">Profile</a>
                <form method="post" action="/auth/logout" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="link-button">Log out</button>
                </form>
                {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>Fencer Schedules - Live Tournament Tracking</small>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
